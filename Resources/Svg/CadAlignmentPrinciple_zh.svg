<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="Segoe UI, -apple-system, sans-serif">
  <defs>
    <marker id="arrowOrange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#FF5722"/>
    </marker>
    <marker id="arrowAngle" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#FF5722"/>
    </marker>
  </defs>

  <!-- ==================== 左侧面板 ==================== -->
  <!-- 面板背景 -->
  <rect x="24" y="42" width="420" height="490" rx="8" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1"/>
  <!-- 标题栏 -->
  <rect x="24" y="42" width="420" height="34" rx="8" fill="#1976D2"/>
  <rect x="24" y="66" width="420" height="10" fill="#1976D2"/>
  <text x="234" y="65" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="600">旋转前 — CAD 原始姿态</text>

  <!-- 圆弧 C形 (浅蓝虚线) -->
  <path d="M 92.3 293 A 138 138 0 1 1 367.7 293" fill="none" stroke="#90CAF9" stroke-width="2.5" stroke-dasharray="8,4"/>

  <!-- P1-P2 红色基准线(水平) -->
  <line x1="288.3" y1="430.1" x2="171.7" y2="430.1" stroke="#E53935" stroke-width="2.8"/>
  <circle cx="288.3" cy="430.1" r="8" fill="#E53935" stroke="#FFFFFF" stroke-width="1.5"/>
  <circle cx="171.7" cy="430.1" r="8" fill="#E53935" stroke="#FFFFFF" stroke-width="1.5"/>
  <text x="300" y="440" fill="#E53935" font-size="12" font-weight="600">P1</text>
  <text x="152" y="440" fill="#E53935" font-size="12" font-weight="600">P2</text>
  <text x="206" y="452" text-anchor="middle" fill="#999999" font-size="10.5" font-style="italic">基准线段 0°</text>

  <!-- P3-P4 绿色弦 -->
  <line x1="355.1" y1="246.7" x2="309.2" y2="192.0" stroke="#43A047" stroke-width="2.5"/>
  <circle cx="355.1" cy="246.7" r="7" fill="#43A047" stroke="#FFFFFF" stroke-width="1.5"/>
  <circle cx="309.2" cy="192.0" r="7" fill="#43A047" stroke="#FFFFFF" stroke-width="1.5"/>
  <text x="364" y="240" fill="#43A047" font-size="11" font-weight="600">P3</text>
  <text x="294" y="184" fill="#43A047" font-size="11" font-weight="600">P4</text>

  <!-- P5-P6 紫色弦 -->
  <line x1="150.8" y1="192.0" x2="104.9" y2="246.7" stroke="#7B1FA2" stroke-width="2.5"/>
  <circle cx="150.8" cy="192.0" r="7" fill="#7B1FA2" stroke="#FFFFFF" stroke-width="1.5"/>
  <circle cx="104.9" cy="246.7" r="7" fill="#7B1FA2" stroke="#FFFFFF" stroke-width="1.5"/>
  <text x="158" y="184" fill="#7B1FA2" font-size="11" font-weight="600">P5</text>
  <text x="86" y="254" fill="#7B1FA2" font-size="11" font-weight="600">P6</text>

  <!-- Pa-Pb 橙色弦 -->
  <line x1="92.3" y1="293.0" x2="117.0" y2="225.8" stroke="#F57C00" stroke-width="2.3"/>
  <circle cx="92.3" cy="293.0" r="7" fill="#F57C00" stroke="#FFFFFF" stroke-width="1.5"/>
  <circle cx="117.0" cy="225.8" r="7" fill="#F57C00" stroke="#FFFFFF" stroke-width="1.5"/>
  <text x="70" y="298" fill="#F57C00" font-size="11" font-weight="600">Pa</text>
  <text x="122" y="218" fill="#F57C00" font-size="11" font-weight="600">Pb</text>

  <!-- 回转中心 O -->
  <line x1="216" y1="305" x2="244" y2="305" stroke="#333333" stroke-width="1.5"/>
  <line x1="230" y1="291" x2="230" y2="319" stroke="#333333" stroke-width="1.5"/>
  <circle cx="230" cy="305" r="12" fill="none" stroke="#333333" stroke-width="1.5"/>
  <circle cx="230" cy="305" r="6" fill="#333333"/>
  <text x="248" y="299" fill="#333333" font-size="13" font-weight="600">O</text>
  <text x="264" y="301" fill="#555555" font-size="10">(Mox,Moy)</text>
  <text x="156" y="330" text-anchor="middle" fill="#888888" font-size="10" font-style="italic">Rz 回转中心 = 圆心</text>

  <!-- 角度θ标注 -->
  <path d="M 320 246.7 A 40 40 0 0 0 339 222" fill="none" stroke="#FF5722" stroke-width="1.5" marker-end="url(#arrowAngle)"/>
  <text x="344" y="228" fill="#FF5722" font-size="13" font-weight="bold">θ</text>

  <!-- ==================== 中间过渡区 ==================== -->
  <!-- 橙色箭头线 -->
  <line x1="458" y1="285" x2="514" y2="285" stroke="#FF5722" stroke-width="3.5" marker-end="url(#arrowOrange)"/>
  <polygon points="512,277 528,285 512,293" fill="#FF5722"/>

  <!-- 5步文字 -->
  <text x="468" y="268" fill="#37474F" font-size="10" font-weight="500">① 求回转中心</text>
  <text x="468" y="282" fill="#37474F" font-size="10" font-weight="500">② 算全局偏移</text>
  <text x="468" y="296" fill="#FF5722" font-size="10" font-weight="600">③ CAD 角度</text>
  <text x="468" y="310" fill="#FF5722" font-size="10" font-weight="600">④ 先平移后旋转</text>
  <text x="468" y="324" fill="#37474F" font-size="10" font-weight="500">⑤ 夹爪定位</text>

  <!-- 副标题 -->
  <text x="472" y="340" fill="#AAAAAA" font-size="10" font-style="italic">统一摆正至基准方向</text>

  <!-- ==================== 右侧面板 ==================== -->
  <!-- 面板背景 -->
  <rect x="534" y="42" width="390" height="490" rx="8" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1"/>
  <!-- 标题栏 -->
  <rect x="534" y="42" width="390" height="34" rx="8" fill="#2E7D32"/>
  <rect x="534" y="66" width="390" height="10" fill="#2E7D32"/>
  <text x="729" y="65" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="600">旋转后 — 机械坐标对齐</text>

  <!-- 圆弧 C形 (浅绿虚线) -->
  <path d="M 582.3 293 A 138 138 0 1 1 857.7 293" fill="none" stroke="#A5D6A7" stroke-width="2.5" stroke-dasharray="8,4"/>

  <!-- P1'-P2' 红色基准线(不变) -->
  <line x1="798.3" y1="430.1" x2="681.7" y2="430.1" stroke="#E53935" stroke-width="2.8"/>
  <circle cx="798.3" cy="430.1" r="8" fill="#E53935" stroke="#FFFFFF" stroke-width="1.5"/>
  <circle cx="681.7" cy="430.1" r="8" fill="#E53935" stroke="#FFFFFF" stroke-width="1.5"/>
  <text x="808" y="440" fill="#E53935" font-size="12" font-weight="600">P1'</text>
  <text x="662" y="440" fill="#E53935" font-size="12" font-weight="600">P2'</text>
  <text x="708" y="452" text-anchor="middle" fill="#999999" font-size="10.5" font-style="italic">基准（不变）</text>

  <!-- P3'-P4' 绿色弦(已摆正水平) Y=335 -->
  <line x1="618" y1="335" x2="826" y2="335" stroke="#43A047" stroke-width="2.5"/>
  <circle cx="618" cy="335" r="7" fill="#43A047" stroke="#FFFFFF" stroke-width="1.5"/>
  <circle cx="826" cy="335" r="7" fill="#43A047" stroke="#FFFFFF" stroke-width="1.5"/>
  <text x="596" y="323" fill="#43A047" font-size="11" font-weight="600">P4'</text>
  <text x="834" y="323" fill="#43A047" font-size="11" font-weight="600">P3'</text>
  <text x="686" y="350" text-anchor="middle" fill="#388E3C" font-size="9.5" font-style="italic">✓ 已摆正至水平</text>

  <!-- P5'-P6' 紫色弦(已摆正水平) Y=265 -->
  <line x1="618" y1="265" x2="800" y2="265" stroke="#7B1FA2" stroke-width="2.5"/>
  <circle cx="618" cy="265" r="7" fill="#7B1FA2" stroke="#FFFFFF" stroke-width="1.5"/>
  <circle cx="800" cy="265" r="7" fill="#7B1FA2" stroke="#FFFFFF" stroke-width="1.5"/>
  <text x="596" y="253" fill="#7B1FA2" font-size="11" font-weight="600">P6'</text>
  <text x="808" y="253" fill="#7B1FA2" font-size="11" font-weight="600">P5'</text>
  <text x="668" y="280" text-anchor="middle" fill="#7B1FA2" font-size="9.5" font-style="italic">✓ 已摆正至水平</text>

  <!-- Pa'-Pb' 橙色弦(已摆正水平) Y=200 -->
  <line x1="618" y1="200" x2="776" y2="200" stroke="#F57C00" stroke-width="2.3"/>
  <circle cx="618" cy="200" r="7" fill="#F57C00" stroke="#FFFFFF" stroke-width="1.5"/>
  <circle cx="776" cy="200" r="7" fill="#F57C00" stroke="#FFFFFF" stroke-width="1.5"/>
  <text x="596" y="188" fill="#F57C00" font-size="11" font-weight="600">Pa'</text>
  <text x="784" y="188" fill="#F57C00" font-size="11" font-weight="600">Pb'</text>
  <text x="654" y="215" text-anchor="middle" fill="#EF6C00" font-size="9.5" font-style="italic">✓ 已摆正至水平</text>

  <!-- O' 回转中心 -->
  <line x1="726" y1="305" x2="754" y2="305" stroke="#333333" stroke-width="1.5"/>
  <line x1="740" y1="291" x2="740" y2="319" stroke="#333333" stroke-width="1.5"/>
  <circle cx="740" cy="305" r="12" fill="none" stroke="#333333" stroke-width="1.5"/>
  <circle cx="740" cy="305" r="6" fill="#333333"/>
  <text x="762" y="299" fill="#333333" font-size="13" font-weight="600">O'</text>
  <text x="700" y="330" text-anchor="middle" fill="#888888" font-size="10" font-style="italic">回转中心不动</text>

  <!-- 旋转轨迹虚线 -->
  <path d="M 355.1 246.7 Q 570 220 826 335" fill="none" stroke="#BDBDBD" stroke-width="1.2" stroke-dasharray="4,3"/>
  <path d="M 309.2 192 Q 550 180 618 335" fill="none" stroke="#BDBDBD" stroke-width="1.2" stroke-dasharray="4,3"/>
  <path d="M 150.8 192 Q 400 170 800 265" fill="none" stroke="#BDBDBD" stroke-width="1.2" stroke-dasharray="4,3"/>
  <path d="M 104.9 246.7 Q 420 230 618 265" fill="none" stroke="#BDBDBD" stroke-width="1.2" stroke-dasharray="4,3"/>
  <path d="M 92.3 293 Q 380 240 776 200" fill="none" stroke="#BDBDBD" stroke-width="1.2" stroke-dasharray="4,3"/>
  <path d="M 117.0 225.8 Q 380 210 618 200" fill="none" stroke="#BDBDBD" stroke-width="1.2" stroke-dasharray="4,3"/>

  <!-- ==================== 底部区域 ==================== -->
  <!-- 步骤条背景 -->
  <rect x="176" y="550" width="608" height="48" rx="24" fill="#263238"/>

  <!-- 步骤条内容 -->
  <g transform="translate(196, 574)">
    <!-- Step 1 -->
    <circle cx="0" cy="0" r="5" fill="#1976D2" stroke="#FFFFFF" stroke-width="1.5"/>
    <text x="13" y="4" fill="#CFD8DC" font-size="10.5">① 回转中心</text>
    <!-- 连线1 -->
    <line x1="72" y1="0" x2="102" y2="0" stroke="#455A64" stroke-width="1.5"/>
    <!-- Step 2 -->
    <circle cx="107" cy="0" r="5" fill="#FF9800" stroke="#FFFFFF" stroke-width="1.5"/>
    <text x="120" y="4" fill="#CFD8DC" font-size="10.5">② 全局偏移</text>
    <!-- 连线2 -->
    <line x1="175" y1="0" x2="205" y2="0" stroke="#455A64" stroke-width="1.5"/>
    <!-- Step 3 -->
    <circle cx="210" cy="0" r="5" fill="#9C27B0" stroke="#FFFFFF" stroke-width="1.5"/>
    <text x="223" y="4" fill="#CFD8DC" font-size="10.5">③ 旋转角度</text>
    <!-- 连线3 -->
    <line x1="278" y1="0" x2="308" y2="0" stroke="#455A64" stroke-width="1.5"/>
    <!-- Step 4 -->
    <circle cx="313" cy="0" r="5" fill="#00897B" stroke="#FFFFFF" stroke-width="1.5"/>
    <text x="326" y="4" fill="#CFD8DC" font-size="10.5">④ 坐标变换</text>
    <!-- 连线4 -->
    <line x1="398" y1="0" x2="428" y2="0" stroke="#455A64" stroke-width="1.5"/>
    <!-- Step 5 -->
    <circle cx="433" cy="0" r="5" fill="#2E7D32" stroke="#FFFFFF" stroke-width="1.5"/>
    <text x="446" y="4" fill="#80CBC4" font-size="10.5" font-weight="600">⑤ 夹爪定位</text>
  </g>

  <!-- 公式 -->
  <text x="480" y="616" text-anchor="middle" fill="#888888" font-size="10.5">
    核心公式: Xm=Cx+ΔX → dx=Xm-Mox → X_new=dx·cosθ-dy·sinθ+Mox  |  Gripper_X = X_new + OffX
  </text>
</svg>